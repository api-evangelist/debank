note: 'DeBank ships NO first-party client library for the DeBank OpenAPI in any language. The docs contain curl
  examples only and link to no SDK. The DeBankDeFi GitHub organisation (42 public repos) is blockchain infrastructure
  — forks of go-ethereum, cometbft, cosmos-sdk, optimism, a DeFi chain rollup node — with no API client among them.
  @debank/common is first-party but is a front-end constants/metadata package for the Rabby wallet UI, not a client
  for the Cloud API. Every package that actually calls pro-openapi.debank.com is third-party and unmaintained: the
  newest of them last shipped in 2023, four years after the API it wraps. Versions and dates below were read from
  registry.npmjs.org on 2026-08-12.'
