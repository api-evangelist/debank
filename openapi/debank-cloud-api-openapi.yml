    get:
      responses:
        '200':
          description: Success
      operationId: get_get_contract_view
      tags:
      - Cloud
      summary: Get get contract view
      x-summary-source: derived
  /cloud/protocol/list:
    get:
      responses:
        '200':
          description: Success
      operationId: get_protocol_list_view
      tags:
      - Cloud
      summary: Get protocol list view
      x-summary-source: derived
  /cloud/token:
    get:
      responses:
        '200':
          description: Success
      operationId: get_get_token_view
      tags:
      - Cloud
      summary: Get get token view
      x-summary-source: derived
components:
  securitySchemes:
    accessKey:
      type: apiKey
