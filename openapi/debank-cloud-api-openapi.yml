openapi: 3.2.0
info:
  title: DeBank Open Cloud API
  version: '1.0'
  description: Build for DeFi Developers.
servers:
- url: /
security:
- accessKey: []
tags:
- name: Cloud
paths:
  /cloud/chain/list:
    get:
      responses:
        '200':
          description: Success
