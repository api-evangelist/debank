components:
  schemas:
    UserHistory:
      properties:
        cate_dict:
          type: object
          description: cate_dict
        history_list:
          type: array
          items:
            $ref: '#/components/schemas/history_list'
        project_dict:
          type: object
          description: project dict
        token_dict:
          type: object
          description: token dict
      type: object
    sends:
      properties:
        amount:
          type: number
          example: 0.1
        to_addr:
          type: string
          description: to_addr
          example: '0x495f947276749ce646f68ac8c248420045cb7b5e'
        token_id:
          type: string
          description: token_id
          example: '0x495f947276749ce646f68ac8c248420045cb7b5e'
      type: object
    attributes:
      properties:
        trait_type:
          type: string
          description: trait_type
          example: Artist
        value:
          type: object
          example: SpaceTurtleShip
      type: object
    tx:
      properties:
        eth_gas_fee:
          type: number
          example: 0.002296035
        usd_gas_fee:
          type: number
          example: 0.002296035
        value:
          type: number
          example: 0.002296035
        from_addr:
          type: string
          description: from_addr
          example: '0x495f947276749ce646f68ac8c248420045cb7b5e'
        to_addr:
