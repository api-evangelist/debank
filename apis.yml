aid: debank
name: DeBank
description: DeBank is a Web3 portfolio tracker and DeFi data platform operated by DeBank Global Pte. Ltd. (Singapore) that
  indexes wallet balances, protocol positions, NFTs, token prices and transaction history across a large set of EVM and
  non-EVM chains. Its developer arm, DeBank Cloud, exposes that data core as the DeBank OpenAPI (a Swagger 2.0 contract
  at pro-openapi.debank.com covering chain, protocol, pool, token, user-portfolio and wallet transaction-simulation endpoints),
  as DeBank Connect (an OAuth 2.0 authorization-code sign-in that lets a dApp read an authorizing user's base, on-chain
  and social data), and as an Official Account messaging API for reaching on-chain users through DeBank Hi. Access is metered
  in prepaid "units" bought from the DeBank Cloud dashboard, keyed by an AccessKey header, with a 14-day free trial and
  a documented 100 requests/second ceiling on the Pro plan.
