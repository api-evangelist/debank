apis:
- name: DeBank Connect
  description: >-
    OAuth 2.0 authorization-code sign-in for dApps. After a user authorizes, the dApp exchanges the code
    at api.connect.debank.com/oauth/token using HTTP Basic client credentials and reads the user's base
    profile (web3_id, avatar, on-chain birth date, follower value), on-chain portfolio data, and social
    following data against three read-only scopes.
  humanURL: https://docs.cloud.debank.com/en/debank-connect/integration
  baseURL: https://api.connect.debank.com
  tags:
