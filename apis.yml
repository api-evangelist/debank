apis:
- name: DeBank OpenAPI
  description: The DeBank Cloud Pro API — a Swagger 2.0 contract published at the API host root covering chain and protocol
    metadata, pool and token data, historical token prices, user portfolio reads (token lists, NFT lists, complex protocol
    positions, net-worth curves, transaction history, token/NFT approvals), wallet helpers (transaction pre-execution, transaction
    explanation, gas market), unit-balance accounting, and Official Account messaging. Authenticated with an AccessKey header
    and metered in prepaid units.
  humanURL: https://docs.cloud.debank.com/en/readme/open-api
  baseURL: https://pro-openapi.debank.com
  tags:
  - web3
  - defi
  - blockchain
  - portfolio-tracking
  - on-chain-data
  - token-data
  - nft
  properties:
  - type: OpenAPI
    url: openapi/debank-pro-openapi.yml
  - type: Documentation
    url: https://docs.cloud.debank.com/en/readme/open-api
  - type: APIReference
    url: https://docs.cloud.debank.com/en/readme/api-pro-reference
  - type: ErrorCatalog
    url: errors/debank-problem-types.yml
  - type: Overlay
    url: overlays/debank-pro-openapi-overlay.yaml
- name: DeBank Connect
  description: OAuth 2.0 authorization-code sign-in for dApps. After a user authorizes, the dApp exchanges the code at api.connect.debank.com/oauth/token
    using HTTP Basic client credentials and reads the user's base profile (web3_id, avatar, on-chain birth date, follower
    value), on-chain portfolio data, and social following data against three read-only scopes.
  humanURL: https://docs.cloud.debank.com/en/debank-connect/integration
  baseURL: https://api.connect.debank.com
  tags:
  - oauth
  - identity
  - web3
  - social
  properties:
